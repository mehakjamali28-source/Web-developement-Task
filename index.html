    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>MY IMAGE-GALLERY!</h1>

        <img class="nature" src="images/beautiful Rose🌹.jpg" alt="">

        <img class="nature" src="images/806285139584730074.jpg" alt="">
        <img class="nature" src="images/476959416808274856.jpg" alt="">
        <img class="nature" src="images/812970170281406531.jpg" alt="">

        <img class="nature" src="images/8092474327912358.jpg" alt="">

    </div>

</body>
</html>
